function display(){count.textContent='かべを こわそう　'+hits+' / 12';progress.setAttribute('aria-valuenow',hits);for(var i=0;i<12;i++)progress.children[i].className=i<hits?'done':''}
function breakBrick(){var b=bricks.filter(function(q){return !q.broken})[0];if(!b)return;b.broken=true;hits++;display();impact(hits===12);if(!reduce){for(var i=0;i<5;i++)rubble.push({x:b.x,y:b.y+(Math.random()-.5)*.45,z:b.z+(Math.random()-.5)*.35,vx:1.4+Math.random()*2,vy:(Math.random()-.5)*2,vz:1+Math.random()*2,s:.13+Math.random()*.12,c:b.c,a:0,spin:(Math.random()-.5)*10,life:1.2});for(i=0;i<6;i++)dust.push({x:b.x,y:b.y+(Math.random()-.5)*.6,z:b.z,vx:Math.random()*1.7,vy:Math.random()-.5,vz:.5+Math.random(),s:.045+Math.random()*.08,life:.6})}if(hits===12)doneAt=performance.now()+650}
function tick(t){frame=0;var dt=Math.min(.05,(t-(last||t))/1000);last=t;if(!active&&queue>0&&hits<12){queue--;active={start:t,arm:hits%2?'L':'R',hit:false}}if(active){var p=(t-active.start)/350;if(p>=.45&&!active.hit){active.hit=true;breakBrick()}if(p>=1)active=null}rubble=rubble.filter(function(b){b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;b.vz-=9*dt;b.a+=b.spin*dt;if(b.z<b.s*.5){b.z=b.s*.5;b.vz=Math.abs(b.vz)*.23;b.vx*=.72;b.vy*=.72;b.spin*=.6}return b.life>0});dust=dust.filter(function(d){d.life-=dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.z+=d.vz*dt;d.s+=.12*dt;return d.life>0});render(t);if(doneAt&&t>=doneAt){completed=true;doneAt=0;finish.hidden=false;stage.disabled=true;document.getElementById('again').focus()}if(active||queue||rubble.length||dust.length||doneAt)frame=requestAnimationFrame(tick);else last=0}
function punch(){if(completed||hits+queue+(active&&!active.hit?1:0)>=12)return;audio();queue++;if(!frame){last=0;frame=requestAnimationFrame(tick)}}
function reset(){if(frame)cancelAnimationFrame(frame);frame=0;last=0;hits=0;queue=0;active=null;doneAt=0;completed=false;rubble=[];dust=[];bricks=[];for(var r=0;r<4;r++)for(var c=0;c<3;c++)bricks.push({x:.58,y:(c-1)*.74,z:.26+r*.54,c:[179+((r+c)%3)*9,108+((r+c)%3)*7,72+((r+c)%3)*5],broken:false,priority:Math.abs(r-2)*1.4+Math.abs(c-1)});bricks.sort(function(a,b){return a.priority-b.priority});finish.hidden=true;stage.disabled=false;display();resize()}
for(var i=0;i<12;i++)progress.appendChild(document.createElement('i'));stage.addEventListener('click',punch);document.getElementById('again').addEventListener('click',reset);sound.addEventListener('click',function(){level=(level+1)%4;sound.textContent='音：'+['なし','小','中','大'][level];if(master)master.gain.value=[0,.13,.28,.46][level];if(level)audio()});window.addEventListener('resize',resize);reset();
})();
